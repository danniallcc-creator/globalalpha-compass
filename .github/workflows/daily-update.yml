name: Daily Data Update (Trending + Trade News + Risk)

on:
  schedule:
    - cron: '0 0 * * *'    # UTC 00:00 = 北京 08:00
    - cron: '0 12 * * *'   # UTC 12:00 = 北京 20:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml pytrends
      - run: python scripts/fetch_trending.py
        env:
          PYTHONUNBUFFERED: '1'
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/trending.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "📊 Update data: trending + trade news + risk $(date -u +%Y-%m-%d %H:%M)"
            git push
          fi

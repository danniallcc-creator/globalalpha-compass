name: Daily Data Update (Trending + Categories + Social + Policy + Trade)

on:
  schedule:
    - cron: '0 0 * * *'    # UTC 00:00 = 北京 08:00
    - cron: '0 12 * * *'   # UTC 12:00 = 北京 20:00
    - cron: '0 16 * * *'   # UTC 16:00 = Beijing 00:00 force daily refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml pytrends
      - run: python scripts/fetch_trending.py
        env:
          PYTHONUNBUFFERED: '1'
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - name: Aggregate L1 data
        run: python scripts/aggregate_l1_data.py
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
                    git add -A data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data: trending + categories + social + policy $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi

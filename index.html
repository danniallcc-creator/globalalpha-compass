                ['澳洲','AUD','200-700',[['Temple & Webster','350']]],

function getPricing(cat) {
    var keys = Object.keys(PRICING);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i] !== 'default' && cat.indexOf(keys[i]) !== -1) {
            return PRICING[keys[i]];
        }
    }
    return PRICING['default'];
}

// =========================================================
// 合规匹配
// =========================================================
function getCompliance(cat) {
    for (var i = 0; i < COMPLIANCE.length; i++) {
        var item = COMPLIANCE[i];
        for (var j = 0; j < item.kw.length; j++) {
            if (cat.indexOf(item.kw[j]) !== -1) {
                return item;
            }
        }
    }
    return {
        reason: '建议在进入目标市场前，详细研究目的地国对该类产品的准入标准及认证要求。',
        suggestion: '建议委托专业贸易合规机构进行市场准入评估，制定专属合规路径。',
        breakthrough: '积极寻找当地代理商，结合本地化需求调整产品定位，快速切入细分市场。',
        hs: '999999', tariff_us: '5~25%', tariff_eu: '2.7~12%'
    };
}

// =========================================================
// 罗盘算法：加权评分
// =========================================================
function computeCompass(cat) {
    var isElec = ['储能','电池','手机','芯片','集成电路','家电'].some(function(k){ return cat.indexOf(k) !== -1; });
    var isFood = ['食品','农产品','水产','粮食'].some(function(k){ return cat.indexOf(k) !== -1; });
    var isIndu = ['钢材','机电','铝','机械','船舶'].some(function(k){ return cat.indexOf(k) !== -1; });

    var scored = COUNTRIES.map(function(c) {
        var gdpW  = isElec ? 1.3 : isIndu ? 1.5 : 1.0;
        var popW  = isFood ? 2.0 : 1.0;
        var growW = isElec ? 1.5 : 1.2;
        var score = (c.gdp / 10000) * gdpW + (c.pop / 80) * popW + c.growth * growW;
        return {name:c.name, gdp:c.gdp, pop:c.pop, growth:c.growth, region:c.region, score:score};
    });

    var byGdp   = scored.slice().sort(function(a,b){ return b.gdp - a.gdp; });
    var byPop   = scored.slice().sort(function(a,b){ return b.pop - a.pop; });
    var emerging = scored.filter(function(c){ return c.gdp < 20000; })
                         .sort(function(a,b){ return b.score - a.score; });

    return {
        profit: byGdp.slice(0, 3),
        mass:   byPop.slice(0, 2),
        blue:   emerging.slice(0, 3)
    };
}

// =========================================================
// DOM 工具
// =========================================================
function show(id) { document.getElementById(id).style.display = ''; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function countryCard(c) {
    return '<div class="card p-4 rounded-xl">' +
        '<div class="font-bold">' + c.name + '</div>' +
        '<div class="text-xs text-gray-400 mt-1">' + c.region + '</div>' +
        '<div class="text-xs text-gray-300 mt-1">GDP $' + Math.round(c.gdp/1000) + 'k | 增速 ' + c.growth + '%</div>' +
    '</div>';
}

// =========================================================
// 主函数：开启罗盘
// =========================================================
function runCompass() {
    var cat = document.getElementById('search-input').value.trim();
    if (!cat) { alert('请输入产品类目'); return; }

    // UI: 显示 loading，隐藏结果
    show('el-loading');
    hide('el-results');
    hide('el-compliance');
    hide('el-pricing');
    hide('el-customs');
    hide('el-download');

    // 给浏览器一帧时间先渲染 loading，再执行计算
    setTimeout(function() {
        try {
            renderAll(cat);
        } catch(e) {
            hide('el-loading');
            alert('分析出错，请刷新后重试：' + e.message);
        }
    }, 200);
}

function renderAll(cat) {
    var compass    = computeCompass(cat);
    var compliance = getCompliance(cat);
    var pricing    = getPricing(cat);

    // --- 国家矩阵 ---
    document.getElementById('profit-list').innerHTML = compass.profit.map(countryCard).join('');
    document.getElementById('mass-list').innerHTML   = compass.mass.map(countryCard).join('');
    document.getElementById('blue-list').innerHTML   = compass.blue.map(countryCard).join('');

    // --- 合规 ---
    document.getElementById('compliance-content').innerHTML =
        '<div class="border-r border-white/10 pr-8">' +
            '<h3 class="text-blue-400 font-bold mb-3">准入红线</h3>' +
            '<p class="text-gray-300 text-sm leading-relaxed">' + compliance.reason + '</p>' +
            '<p class="text-gray-300 text-sm leading-relaxed mt-3">' + compliance.suggestion + '</p>' +
        '</div>' +
        '<div>' +
            '<h3 class="text-green-400 font-bold mb-3">出海突破口</h3>' +
            '<p class="text-gray-300 text-sm leading-relaxed">' + compliance.breakthrough + '</p>' +
        '</div>';

    // --- 定价 ---
    var pricingHtml = '';
    for (var i = 0; i < pricing.length; i++) {
        var region = pricing[i][0], cur = pricing[i][1], range = pricing[i][2], prods = pricing[i][3];
        var prodHtml = '';
        for (var j = 0; j < prods.length; j++) {
            prodHtml += '<div>' + prods[j][0] + ' (' + cur + ' ' + prods[j][1] + ')</div>';
        }
        pricingHtml +=
            '<div class="card p-5 rounded-2xl">' +
                '<div class="text-xs text-blue-400 font-bold mb-2">' + region + '</div>' +
                '<div class="text-2xl font-bold mb-3">' + cur + ' ' + range + '</div>' +
                '<div class="text-xs text-gray-400 space-y-1">' + prodHtml + '</div>' +
            '</div>';
    }
    document.getElementById('pricing-grid').innerHTML = pricingHtml;

    // --- 海关 ---
    var hs = compliance.hs || '999999';
    var us = compliance.tariff_us || '5~25%';
    var eu = compliance.tariff_eu || '2.7~12%';
    document.getElementById('customs-content').innerHTML =
        '<div>' +
            '<p class="text-gray-400 text-sm mb-2">HS Code</p>' +
            '<div class="text-3xl font-bold text-blue-300">' + hs + '</div>' +
            '<div class="text-xs text-green-400 mt-3">出口额同比增速 +8~15%</div>' +
        '</div>' +
        '<div class="border-x border-white/10 px-8">' +
            '<p class="text-gray-400 text-sm mb-2">风险预警</p>' +
            '<div class="text-xs text-red-400 space-y-1">' +
                '<div>- 欧盟新法规持续更新(2025)</div>' +
                '<div>- 美国 301 关税波动风险</div>' +
                '<div>- 目标市场认证要求变化</div>' +
            '</div>' +
        '</div>' +
        '<div>' +
            '<p class="text-gray-400 text-sm mb-2">主要市场关税</p>' +
            '<div class="text-sm space-y-2">' +
                '<div class="flex justify-between"><span class="text-gray-400">美国</span><span>' + us + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-400">欧盟</span><span>' + eu + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-400">东南亚</span><span>0~5%</span></div>' +
            '</div>' +
        '</div>';

    // 显示所有结果
    hide('el-loading');
    document.getElementById('el-results').style.display = 'grid';
    show('el-compliance');
    document.getElementById('el-pricing').style.display = 'block';
    show('el-customs');
    show('el-download');

    window.scrollTo({top: document.getElementById('el-results').offsetTop - 100, behavior: 'smooth'});
}
